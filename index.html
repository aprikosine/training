<html lang="de">
<head>
<meta charset="utf-8">

<title>Training</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232733;--line:#2e3340;--txt:#e8eaf0;--mut:#9aa1b2;--acc:#4ade80;--acc2:#60a5fa;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header .sub{color:var(--mut);font-size:13px}
main{padding:12px 12px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card.today{box-shadow:inset 0 0 0 2px var(--acc)}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:14px}
small{font-size:11px;opacity:.8}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--card2);color:var(--txt);font-size:16px;font-weight:600;margin-top:8px}
.btn.pri{background:var(--acc);color:#06210f}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px;margin:0}
.btn.dng{background:#3b1d1d;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#151820;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px}
.tabbar button span{display:block;font-size:20px}
.tabbar button.on{color:var(--acc)}
.set{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:6px;align-items:center;margin:6px 0}
.set input{width:100%;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:17px;text-align:center}
.set .ok{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:20px}
.set.done .ok{background:var(--acc);color:#06210f;border-color:var(--acc)}
.set.done input{border-color:#2f5e3f}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:14px;line-height:1.2}
.seg button.on{background:var(--acc2);color:#0b1a33;border-color:var(--acc2);font-weight:600}
.hint{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.box{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}
.box.on{background:var(--acc);border-color:var(--acc);color:#06210f}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
input.t,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;font-family:inherit}
textarea{min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--acc2);color:#0b1a33;border-radius:12px;padding:10px 14px;display:none;justify-content:space-between;align-items:center;font-weight:700;z-index:9}
#timer.show{display:flex}
#timer.end{background:var(--warn)}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:4px 0}
.pill{display:inline-block;background:var(--card2);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mut);margin:2px 4px 2px 0}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exhead h2{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
details{background:var(--card);border-radius:12px;margin-bottom:8px;padding:0 14px}
summary{padding:13px 0;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details[open]{padding-bottom:12px}
.tl{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl.tr b{color:var(--acc)}
.exl{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.exl:last-child{border-bottom:0}
</style>
</head>

 ['Anstrengung vs. Schmerz','Brennen im Muskel, schwere Arme und Muskelkater am nächsten Tag sind normal. Für Gelenke gilt die <b>Schmerz-Ampel</b>:<br>🟢 Leichtes Ziehen bis ca. 2 von 10, das im Training nicht schlimmer wird und am nächsten Morgen weg ist: weitermachen.<br>🟡 3–5 von 10: Übung leichter machen oder heute weglassen.<br>🔴 Stechend, über 5 oder am nächsten Tag schlimmer, Taubheit oder Kribbeln: <b>sofort stoppen</b>, im Check-in notieren.'],

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const li=x=>'<li>'+x+'</li>';
function weekOf(ds){const s=new Date(START+'T00:00:00'),d=new Date(ds+'T00:00:00');const diff=Math.round((d-s)/864e5);return diff<0?0:Math.floor(diff/7)+1}
function fmtDate(ds){return new Date(ds+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'})}
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function phase(w){if(w===0)return 'Vorbereitung: Technik kennenlernen, ganz leicht';if(w<=2)return 'Technikphase: 2 Sätze, bewusst leicht';if(w<=8)return 'Aufbauphase: steigern nach der Regel, „passend" statt „hart"';if(w<=12)return 'Aufbau + Reisen: Halten ist auch ein Erfolg';return 'Nach den 12 Wochen: weiter geht’s'}

// ---------- Daten ----------
function blank(){return {schema:1,startDate:START,sessions:[],weights:[],checkins:[],daily:{},draft:null}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.sessions))return Object.assign(blank(),d)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}}
let data=load(),view='home',checkinWeek=null,planDay=null;

function lastPerf(id){for(let i=data.sessions.length-1;i>=0;i--){const s=data.sessions[i];if(!s.exercises)continue;const e=s.exercises.find(x=>x.id===id);if(e&&e.sets.length)return Object.assign({date:s.date},e)}return null}
function fmtSet(ex,s){return ((ex.wt!=='none'&&s.w!==null&&s.w!==''&&s.w!==undefined)?s.w+(ex.wt==='num'?' kg':'')+' × ':'')+s.r+(ex.rl==='s'?' s':'')}
function hint(id){const ex=EX[id],l=lastPerf(id),burn=ex.iso?'<br>'+BURN:'';
 if(!l)return (ex.first||'Erstes Mal: Wähle ein Gewicht, mit dem die Technik sauber ist und du noch 3+ Wdh übrig hättest. Lieber zu leicht.')+burn;
 const top=ex.reps[1],bot=ex.reps[0],reps=l.sets.map(s=>s.r||0);
 const last='Letztes Mal ('+fmtDate(l.date)+'): '+l.sets.map(s=>fmtSet(ex,s)).join(', ')+(l.effort?' · '+l.effort:'');
 const drop=ex.wt==='num'&&l.sets.some((s,i)=>i>0&&s.w!=null&&s.w===l.sets[i-1].w&&((l.sets[i-1].r||0)-(s.r||0))>=3);
 let adv;
 if(drop&&l.effort==='hart')adv='↔️ Ein Satz ist um 3+ Wdh abgefallen, weil du zu nah ans Versagen gegangen bist. Heute gleiches Gewicht, aber jeden Satz mit 2 Wdh Reserve beenden – dann bleiben die Sätze gleichmäßig.';
 else if(drop)adv='⬇️ Ein Satz ist um 3+ Wdh abgefallen – der Satz davor war zu schwer. Heute 1–2 Gewichtsstufen leichter, sodass alle Sätze ähnlich viele Wdh schaffen.';
 else if(reps.every(r=>r>=top)&&l.effort!=='hart')adv=ex.wt==='num'?'⬆️ Alle Sätze am oberen Ende: heute den kleinsten Gewichtsschritt nach oben (nur einen).':(ex.wt==='text'?'⬆️ Alle Sätze am oberen Ende: heute weniger Hilfe bzw. stärkeres Band.':'⬆️ Alle Sätze am oberen Ende: nimm die schwerere Variante (siehe Anleitung).');
 else if(l.effort==='hart'&&reps.some(r=>r<bot))adv='↔️ War sehr hart: Gewicht halten, auf saubere Technik achten.';
 else adv='➡️ Gleiches Gewicht, versuch 1 Wiederholung mehr.';
 const warn=(ex.big&&l.effort==='hart')?'<br>⚠️ Letztes Mal „hart" – bei dieser Übung nie bis zum Versagen: Satz beenden, wenn noch 2 gehen würden.':'';
 return last+'<br>'+adv+warn+burn}
function weeklyAvgs(){const m={};data.weights.forEach(x=>{const w=weekOf(x.date);(m[w]=m[w]||[]).push(x.kg)});return Object.keys(m).map(Number).sort((a,b)=>a-b).map(w=>({w,avg:m[w].reduce((a,b)=>a+b,0)/m[w].length,n:m[w].length}))}
function dailyCounts(w){const r={kreatin:0,shake:0,spaet:0,haltung:0};Object.keys(data.daily).forEach(k=>{if(weekOf(k)!==w)return;const o=data.daily[k];Object.keys(r).forEach(x=>{if(o[x])r[x]++})});return r}
function curCW(){return checkinWeek!==null?checkinWeek:weekOf(today())}
function getCheckin(w){let c=data.checkins.find(x=>x.week===w);if(!c){c={week:w};data.checkins.push(c);data.checkins.sort((a,b)=>a.week-b.week)}return c}

// ---------- Ansichten ----------
function setHead(t,s){$('#title').textContent=t;$('#sub').textContent=s}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===view||(view==='workout'&&b.dataset.tab==='home')));({home:rHome,plan:rPlan,workout:rWorkout,lib:rLib,weight:rWeight,checkin:rCheckin,data:rData})[view]()}

function rHome(){const t=today(),w=weekOf(t),dow=new Date().getDay();
 setHead('Heute',fmtDate(t)+' · '+(w?'Woche '+w+' von 12':'Vor dem Start (12.10.)'));
 let h='';
 if(data.draft)h+=`<div class="card"><h2>Laufendes Training</h2><div class="mut">${SESSIONS[data.draft.key].name} vom ${fmtDate(data.draft.date)}</div><button class="btn pri" data-act="resume">Fortsetzen</button></div>`;
 const key=DAYPLAN[dow];
 h+=`<div class="card"><div class="mut">${phase(w)}</div>`;
 if(w===0)h+=`<h2 style="margin-top:8px">Vorbereitung</h2><p>Bis zum Start: eine ganz leichte Technik-Session mit den neuen Übungen. Kein Muskelkater vor Montag! Mach außerdem deine Startfotos (siehe Check-in).</p>`;
 if(key){const S=SESSIONS[key];h+=`<h2 style="margin-top:8px">Plan heute: ${S.name}</h2><div class="mut">${S.focus}</div>`+(S.swim?`<button class="btn pri" data-act="start" data-k="${key}">${S.name} eintragen</button>`+(key==='SWIM'?`<button class="btn" data-act="start" data-k="RUN">Stattdessen Laufen eintragen</button>`:''):`<button class="btn pri" data-act="start" data-k="${key}">Training starten</button><button class="btn" data-act="start" data-k="${key}" data-short="1">Kurzversion (ca. 20 min)</button>`)}
 else h+=`<h2 style="margin-top:8px">Ruhetag 😴</h2><div class="mut">Muskeln wachsen in der Pause. Protein nicht vergessen, Kreatin nehmen – Spätmahlzeit heute nur klein und nur bei Hunger.</div>`;
 if(dow===0)h+=`<div class="hint">📝 Sonntag ist Check-in-Tag: Check-in ausfüllen, dann Daten exportieren.</div>`;
 h+='</div>';
 const dl=data.daily[t]||{};
 h+=`<div class="card"><h2>Heute erledigt?</h2>${DAILY.map(x=>`<div class="chk"><div class="box ${dl[x.id]?'on':''}" data-act="daily" data-id="${x.id}">${dl[x.id]?'✓':''}</div><div><b>${x.name}</b><div class="mut">${x.sub}</div></div></div>`).join('')}</div>`;
 const ws=data.sessions.filter(s=>weekOf(s.date)===w),str=ws.filter(s=>!isCardio(s)).length,cd=ws.filter(isCardio).length;
 h+=`<div class="card"><h2>Diese Woche</h2><div>${str} von 4 Krafteinheiten ${str>=3?'✅':''} · Ausdauer: ${cd}</div><div class="mut">3 von 4 = erfolgreiche Woche.</div>${ws.map(s=>`<span class="pill">${fmtDate(s.date)} ${esc(s.name)}</span>`).join('')}</div>`;
 h+=`<div class="card"><h2>Andere Einheit wählen</h2><div class="mut">Für verschobene Tage, Reisewochen oder das Hotel.</div>${Object.keys(SESSIONS).map(k=>`<button class="btn" data-act="start" data-k="${k}">${SESSIONS[k].name}</button>`).join('')}</div>`;
 app.innerHTML=h}

// ---------- Plan ----------
function dayType(dow){return (dow===1||dow===6)?'am':((dow===2||dow===4)?'pm':'rest')}
function mealsFor(dow){const ty=dayType(dow),S=SESSIONS[DAYPLAN[dow]],L=[],shake=['nach dem Training','Proteinshake','1 Messlöffel Whey (ca. 30 g) mit Milch.'];
 L.push(['ca. 7:30','Frühstück','Joghurt, Haferflocken, Banane, Nüsse oder Erdnussbutter + 2–3 Eier (Teeeier 茶叶蛋 oder Mensa-Frühstück). Dazu 1 Beutel Kreatin.']);
 if(ty==='am'){L.push(['ca. 10:00','🏋️ Training',S.name,1]);L.push(shake)}
 L.push(['12:00','Mensa Mittag','2 Proteinportionen (Fleisch, Tofu oder 番茄炒蛋), Gemüse, Reis nach Hunger.']);
 if(ty==='pm'){L.push(['ca. 14:45','Snack vor dem Training','Banane, Joghurt oder ein Baozi.']);L.push([dow===2?'15:30':'15:00','🏋️ Training',S.name,1]);L.push(shake)}
 if(dow===0)L.push(['nachmittags','🏊 Schwimmen oder 🏃 Laufen','Locker, 25–35 min, danach Check-in. Laufen erst, wenn der Rücken schmerzfrei ist.',1]);
 L.push(['18:00','Mensa Abend',ty==='rest'?'Wie mittags.'+(dow===3?' Heute Vorlesung bis 21 Uhr.':''):'Wie mittags. Eine zweite Portion to go für später mitnehmen.']);
 L.push(['ca. 21:00–21:30','Spätmahlzeit',ty==='rest'?'Nur bei Hunger und klein: Joghurt mit etwas Haferflocken oder ein Shake (Whey mit Milch). Kein zweites Mensa-Essen.':'Mensa-Portion to go oder Joghurt mit Haferflocken.']);
 return L}
function rPlan(){const td=new Date().getDay(),d=planDay===null?td:planDay;setHead('Plan','Ernährung pro Tag · Training pro Woche');
 let h=`<div class="card"><h2>🍽️ Ernährung</h2><div class="seg">${[1,2,3,4,5,6,0].map(n=>`<button class="${n===d?'on':''}" data-act="pday" data-v="${n}">${DN[n]}</button>`).join('')}</div><div class="mut" style="margin-top:8px">${d===td?'Heute':DN[d]} · ${dayType(d)==='rest'?'Ruhetag':'Trainingstag'}</div>`;
 h+=mealsFor(d).map(m=>`<div class="tl${m[3]?' tr':''}"><div class="mut">${m[0]}</div><div><b>${m[1]}</b><div class="mut">${m[2]}</div></div></div>`).join('');
 h+=`<h3>Grundregeln</h3><ul><li>2 Proteinportionen bei jeder Mensa-Mahlzeit – Protein (140–170 g) wird nie gekürzt.</li><li>Nie hungrig ins Bett – an Ruhetagen aber nur eine kleine Spätmahlzeit (Joghurt oder Shake).</li><li>Kreatin jeden Tag, egal wann.</li><li>Die Taille entscheidet, nicht die Waage: höchstens +1 cm in 12 Wochen. Bis zum Check-in in Woche 4 (8.11.) kein Extra-Snack.</li></ul></div>`;
 h+=`<div class="card"><h2>🏋️ Training pro Woche</h2><div class="mut">Ab Woche 3: 3 Sätze pro Übung. „Passend" statt „hart", höchstens ein Gewichtsschritt pro Einheit. Tipp auf eine Übung für die Anleitung.</div></div>`;
 WEEK.forEach(([dw,time])=>{const k=DAYPLAN[dw],S=k?SESSIONS[k]:null;
  h+=`<div class="card${dw===td?' today':''}"><div class="exhead"><h2>${DN[dw]} · ${S?S.name:'Ruhetag'}</h2>${dw===td?'<span class="pill" style="color:var(--acc)">heute</span>':''}</div><div class="mut">${time}${S&&!S.swim?' · '+S.focus:''}</div>`;
  if(S&&S.ex)h+=S.ex.map(id=>`<div class="exl" data-act="info" data-id="${id}"><span>${EX[id].name}${S.opt&&S.opt.includes(id)?' <span class="mut">(optional)</span>':''}</span><span class="mut">${EX[id].sets}×${EX[id].reps[0]}–${EX[id].reps[1]} ${EX[id].rl} ›</span></div>`).join('');
  if(S&&S.swim)h+=`<div class="mut" style="margin-top:6px">${S.focus}. Alternativ: lockerer Lauf 25–35 min (erst, wenn der Rücken schmerzfrei ist).</div>`;
  h+='</div>'});
 h+=`<div class="card"><h2>✈️ Reisewoche</h2><div class="mut">Di und Do je „Ganzkörper (Reisewoche)", unterwegs „Hotel-Workout". Beides unter Heute → Andere Einheit wählen.</div></div>`;
 app.innerHTML=h}

function startSession(key,short){const S=SESSIONS[key],w=weekOf(today());
 if(S.swim){data.draft={key,date:today(),start:Date.now(),swim:true,min:'',dist:'',feel:'',notes:''};save();go('workout');return}
 let ids=S.ex.slice();if(short)ids=ids.slice(0,3);
 const ex=ids.map(id=>{let n=(S.sets&&S.sets[id])||EX[id].sets;if(w<=2||short)n=Math.min(n,2);const l=lastPerf(id),sets=[];
  for(let i=0;i<n;i++){const p=l?(l.sets[i]||l.sets[l.sets.length-1]):null;sets.push({w:p&&p.w!=null?String(p.w):'',r:p&&p.r!=null?String(p.r):'',done:false})}
  return {id,sets,effort:''}});
 data.draft={key,date:today(),start:Date.now(),short:!!short,warm:{},ex,notes:''};save();go('workout')}

function chkRow(id,item,on){return `<div class="chk"><div class="box ${on?'on':''}" data-act="warm" data-id="${id}">${on?'✓':''}</div><div style="flex:1" data-act="winfo" data-id="${id}"><b>${item.name}</b> <span class="mut">ⓘ</span><div class="mut">${item.dose}</div></div></div>`}

function rWorkout(){const d=data.draft;if(!d){go('home');return}const S=SESSIONS[d.key];
 setHead(S.name+(d.short?' · Kurz':''),fmtDate(d.date)+' · Woche '+weekOf(d.date));
 if(d.swim){rSwim(d,S);return}
 let h=`<div class="card"><h2>Aufwärmen</h2><div class="mut">Ca. 10–15 min. Tippe auf den Namen für die Anleitung.</div>${S.warm.map(id=>chkRow(id,WARM[id],d.warm[id])).join('')}</div>`;
 d.ex.forEach((e,i)=>{const ex=EX[e.id],opt=S.opt&&S.opt.includes(e.id);
  h+=`<div class="card"><div class="exhead"><div><h2>${ex.name}</h2><div class="mut">${opt?'Optional · ':''}${e.sets.length} × ${ex.reps[0]}–${ex.reps[1]} ${ex.rl} · Pause ${ex.rest} s</div></div><button class="btn sm" data-act="info" data-id="${e.id}">Anleitung</button></div><div class="hint">${hint(e.id)}</div>`;
  h+=`<div class="set"><div class="mut">Satz</div><div class="mut" style="text-align:center">${ex.wl}</div><div class="mut" style="text-align:center">${ex.rl}</div><div></div></div>`;
  e.sets.forEach((s,j)=>{h+=`<div class="set ${s.done?'done':''}" id="s${i}_${j}"><div class="mut">${j+1}</div>${ex.wt==='none'?'<div class="mut" style="text-align:center">–</div>':`<input ${ex.wt==='num'?'inputmode="decimal" placeholder="kg"':'placeholder="z. B. Band lila"'} data-f="w" data-e="${i}" data-s="${j}" value="${esc(s.w)}">`}<input inputmode="numeric" data-f="r" data-e="${i}" data-s="${j}" value="${esc(s.r)}" placeholder="${ex.reps[0]}–${ex.reps[1]}"><button class="ok" data-act="done" data-e="${i}" data-s="${j}">✓</button></div>`});
  h+=`<div class="row" style="justify-content:space-between;margin-top:4px"><button class="btn sm" data-act="addset" data-e="${i}">+ Satz</button><button class="btn sm" data-act="timer" data-sec="${ex.rest}">⏱ Pause ${ex.rest} s</button></div>`;
  h+=`<div class="mut" style="margin-top:10px">Wie schwer war die Übung?</div><div class="seg">${['leicht','passend','hart'].map(k=>`<button class="${e.effort===k?'on':''}" data-act="eff" data-e="${i}" data-v="${k}">${EFFL[k]}</button>`).join('')}</div></div>`});
 if(S.end&&S.end.length)h+=`<div class="card"><h2>Zum Schluss</h2>${S.end.map(id=>chkRow(id,WARM[id],d.warm[id])).join('')}</div>`;
 h+=`<div class="card"><h2>Notizen</h2><div class="mut">Schmerzen, Gefühl, Fragen an den Coach</div><textarea data-f="notes">${esc(d.notes)}</textarea><button class="btn pri" data-act="finish">Training speichern</button><button class="btn dng" data-act="cancel">Training verwerfen</button></div>`;
 app.innerHTML=h}

function rSwim(d,S){app.innerHTML=`<div class="card"><h2>${S.name}</h2><div class="mut">${S.focus}. Starte parallel die Garmin-Aktivität „${S.garmin}".</div><div class="grid2"><div><label class="f">Dauer (min)</label><input class="t" inputmode="numeric" data-f="min" value="${esc(d.min)}"></div><div><label class="f">Strecke (${S.dist}, optional)</label><input class="t" inputmode="decimal" data-f="dist" value="${esc(d.dist)}"></div></div><label class="f">Gefühl</label><div class="seg">${['locker','mittel','hart'].map(k=>`<button class="${d.feel===k?'on':''}" data-act="feel" data-v="${k}">${k}</button>`).join('')}</div><label class="f">Notizen</label><textarea data-f="notes">${esc(d.notes)}</textarea><button class="btn pri" data-act="finish">Speichern</button><button class="btn dng" data-act="cancel">Verwerfen</button></div>`}

function finish(){const d=data.draft,S=SESSIONS[d.key];
 if(d.swim){const dv=num(d.dist),dm=dv===null?null:(S.dist==='km'?Math.round(dv*1000):dv);data.sessions.push({id:'s'+Date.now(),type:d.key,name:S.name,date:d.date,week:weekOf(d.date),durationMin:num(d.min),distanceM:dm,feel:d.feel||null,notes:d.notes});data.draft=null;save();alert('Gespeichert '+(d.key==='RUN'?'🏃':'🏊'));go('home');return}
 const exs=d.ex.map(e=>{const ex=EX[e.id];return {id:e.id,name:ex.name,unit:ex.wl,sets:e.sets.filter(s=>s.done).map(s=>({w:ex.wt==='num'?num(s.w):(ex.wt==='text'?s.w:null),r:num(s.r)})),effort:e.effort||null}}).filter(e=>e.sets.length);
 if(!exs.length&&!confirm('Kein Satz abgehakt. Trotzdem speichern?'))return;
 const dur=Math.round((Date.now()-d.start)/60000);
 data.sessions.push({id:'s'+Date.now(),type:d.key,name:S.name,date:d.date,week:weekOf(d.date),short:d.short,durationMin:dur>300?null:dur,warmupDone:Object.keys(d.warm).filter(k=>d.warm[k]),exercises:exs,notes:d.notes});
 data.draft=null;save();stopTimer();alert('Gespeichert 💪 '+exs.length+' Übungen, '+dur+' min');go('home')}

function exBody(id){const e=EX[id];return `<span class="pill">${e.sets} × ${e.reps[0]}–${e.reps[1]} ${e.rl}</span><span class="pill">Pause ${e.rest} s</span><p><b>Muskeln:</b> ${e.muscles}</p><h3>Einstellen</h3><ul>${e.setup.map(li).join('')}</ul><h3>Ausführung</h3><ol>${e.steps.map(li).join('')}</ol><h3>Merksätze</h3><ul>${e.cues.map(li).join('')}</ul><h3>Häufige Fehler</h3><ul>${e.errors.map(li).join('')}</ul><h3>🛑 Stopp, wenn …</h3><p>${e.stop}</p><p><b>Leichter:</b> ${e.easier}<br><b>Schwerer:</b> ${e.harder}</p><p class="mut">🎥 Video-Suche (YouTube oder Bilibili): „${e.en}"</p>`}
function warmBody(id){const w=WARM[id];return `<span class="pill">${w.dose}</span><ol>${w.steps.map(li).join('')}</ol><ul>${w.cues.map(li).join('')}</ul>`}

function rLib(){setHead('Übungen','Vor dem Training kurz anschauen');
 let h=`<details><summary>🛡️ Grundregeln für sicheres Training</summary>${RULES.map(r=>`<h3>${r[0]}</h3><div>${r[1]}</div>`).join('')}</details>`;
 h+=`<details><summary>🔥 Aufwärmen & Dehnen</summary>${Object.keys(WARM).map(id=>`<h3>${WARM[id].name}</h3>${warmBody(id)}`).join('')}</details>`;
 ['OKA','UKA','OKB','UKB','HOTEL'].forEach(k=>{const S=SESSIONS[k];h+=`<div class="mut" style="margin:14px 4px 6px">${S.name} · ${S.focus}</div>`+S.ex.map(id=>`<details><summary>${EX[id].name} <span class="mut">${EX[id].sets}×${EX[id].reps[0]}–${EX[id].reps[1]}${S.opt&&S.opt.includes(id)?' · optional':''}</span></summary>${exBody(id)}</details>`).join('')});
 app.innerHTML=h}

function spark(wk){if(wk.length<2)return '';const W=300,H=80,p=8,v=wk.map(x=>x.avg),mn=Math.min(...v)-0.3,mx=Math.max(...v)+0.3;const pts=wk.map((x,i)=>[p+i*(W-2*p)/(wk.length-1),H-p-(x.avg-mn)/(mx-mn)*(H-2*p)]);return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-bottom:8px"><polyline fill="none" stroke="#4ade80" stroke-width="2.5" points="${pts.map(q=>q.join(',')).join(' ')}"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#4ade80"/>`).join('')}</svg>`}
function rWeight(){setHead('Gewicht','Morgens, nach der Toilette, vor dem Frühstück');const wk=weeklyAvgs();
 let h=`<div class="card"><h2>Gewicht eintragen</h2><div class="grid2"><div><label class="f">Datum</label><input class="t" type="date" id="wd" value="${today()}"></div><div><label class="f">kg</label><input class="t" id="wkg" inputmode="decimal" placeholder="81,0"></div></div><button class="btn pri" data-act="wsave">Speichern</button><div class="mut" style="margin-top:8px">3–4× pro Woche reicht. Nur der Wochenschnitt zählt – Schwankungen von ±1 kg pro Tag sind normal.</div></div>`;
 h+=`<div class="card"><h2>Wochenschnitt</h2>${spark(wk)}<table><tr><th>Woche</th><th>Ø kg</th><th>Δ</th><th>n</th></tr>${wk.slice().reverse().map((x,i,a)=>{const pr=a[i+1],dl=pr?x.avg-pr.avg:null;return `<tr><td>${x.w===0?'Vor Start':'W'+x.w}</td><td>${x.avg.toFixed(1)}</td><td>${dl===null?'–':(dl>0?'+':'')+dl.toFixed(1)}</td><td>${x.n}</td></tr>`}).join('')}</table><div class="mut">Bis ca. 7.11. lagert das Kreatin noch Wasser ein. Der Wochenschnitt von Woche 4 ist die neue Basis. Wichtiger als die Waage: die Taille (höchstens +1 cm in 12 Wochen).</div></div>`;
 const last=data.weights.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,14);
 h+=`<div class="card"><h2>Letzte Einträge</h2>${last.map(x=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(x.date)}: <b>${x.kg.toFixed(1)} kg</b></span><button class="btn sm" data-act="wdel" data-d="${x.date}">✕</button></div>`).join('')||'<div class="mut">Noch keine Einträge.</div>'}</div>`;
 app.innerHTML=h}

function fld(k,label,v){return `<div><label class="f">${label}</label><input class="t" id="c_${k}" inputmode="decimal" value="${v==null?'':esc(v)}"></div>`}
function scale(k,label,v){return `<label class="f">${label}</label><div class="seg">${[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" data-act="scale" data-k="${k}" data-v="${n}">${n}</button>`).join('')}</div>`}
function rCheckin(){const w=curCW();setHead('Check-in','Jeden Sonntag · danach exportieren');
 const c=data.checkins.find(x=>x.week===w)||{},ws=data.sessions.filter(s=>weekOf(s.date)===w),str=ws.filter(s=>!isCardio(s)).length,sw=ws.filter(s=>s.type==='SWIM').length,rn=ws.filter(s=>s.type==='RUN').length;
 const wk=weeklyAvgs(),cur=wk.find(x=>x.w===w),prev=wk.find(x=>x.w===w-1),dc=dailyCounts(w),due=[0,1,4,8,12].includes(w);
 let h=`<div class="card"><div class="row"><button class="btn sm" data-act="cw" data-v="-1">‹</button><div style="flex:1;text-align:center;font-weight:700">${w===0?'Vor Start':'Woche '+w}</div><button class="btn sm" data-act="cw" data-v="1">›</button></div><h3>Automatisch erfasst</h3><div>Krafteinheiten: <b>${str}/4</b> · Schwimmen: <b>${sw}</b> · Laufen: <b>${rn}</b></div><div>Ø Gewicht: <b>${cur?cur.avg.toFixed(1)+' kg':'–'}</b>${cur&&prev?' ('+(cur.avg-prev.avg>0?'+':'')+(cur.avg-prev.avg).toFixed(1)+' kg)':''}</div><div class="mut">Kreatin ${dc.kreatin}/7 · Shake ${dc.shake}/7 · Spätmahlzeit ${dc.spaet}/7 · Haltung ${dc.haltung}/7</div></div>`;
 h+=`<div class="card"><h2>Garmin (Wochenschnitt)</h2><div class="mut">Garmin Connect → Gesundheitsstatistiken → 7-Tage-Durchschnitt</div><div class="grid2">${fld('hrv','HRV Ø (ms)',c.hrv)}${fld('sleep','Schlaf Ø (h)',c.sleep)}${fld('rhr','Ruhepuls Ø',c.rhr)}${fld('steps','Schritte Ø',c.steps)}</div></div>`;
 h+=`<div class="card"><h2>Wie war die Woche? (1–5)</h2>${scale('energy','Energie',c.energy)}${scale('appetite','Essen geschafft / Appetit',c.appetite)}${scale('motivation','Spaß / Motivation',c.motivation)}${scale('posture','Haltung im Alltag',c.posture)}${scale('soreness','Muskelkater / Erschöpfung (5 = stark)',c.soreness)}</div>`;
 h+=`<div class="card"><h2>Fotos & Maße ${due?'<span class="pill" style="color:#fbbf24">diese Woche fällig</span>':''}</h2><div class="mut">Start, W4, W8, W12. Morgens, gleiches Licht, Handy auf Hüfthöhe: vorn, seitlich, hinten – jeweils entspannt (vorher auf der Stelle gehen, ausatmen, Arme hängen lassen) und bewusst aufgerichtet. Dazu ein 15-min-Schreibtischvideo von der Seite, Standbild bei Minute 10, und ein Liegestütz-Test (so viele saubere wie möglich). Die <b>Taille</b> darfst du jede Woche messen – sie ist dein wichtigster Wert.</div><div class="chk"><div class="box ${c.photos?'on':''}" data-act="ctoggle" data-id="photos">${c.photos?'✓':''}</div><div>Fotos gemacht</div></div><div class="chk"><div class="box ${c.deskvideo?'on':''}" data-act="ctoggle" data-id="deskvideo">${c.deskvideo?'✓':''}</div><div>Schreibtischvideo gemacht</div></div><div class="grid2">${fld('chest','Brust (cm)',c.chest)}${fld('arm','Oberarm locker hängend (cm)',c.arm)}${fld('waist','Taille, Nabelhöhe (cm)',c.waist)}${fld('pushups','Liegestütze (max. sauber)',c.pushups)}</div></div>`;
 h+=`<div class="card"><h2>Notizen & Fragen</h2><label class="f">Beschwerden / Schmerzen</label><textarea id="c_pain">${esc(c.pain)}</textarea><label class="f">Was lief gut, was nicht? Fragen an den Coach</label><textarea id="c_notes">${esc(c.notes)}</textarea><label class="f">Reisen / Termine in den nächsten 2 Wochen</label><textarea id="c_travel">${esc(c.travel)}</textarea><button class="btn pri" data-act="csave">Check-in speichern</button><button class="btn" data-act="tab" data-v="data">Weiter zum Export →</button></div>`;
 app.innerHTML=h}

function rData(){setHead('Daten','Alles bleibt auf diesem Handy');
 app.innerHTML=`<div class="card"><h2>Export für Claude</h2><p class="mut">Jeden Sonntag nach dem Check-in exportieren und in einem neuen Inkognito-Chat zusammen mit coach.md hochladen. Der Export ist gleichzeitig dein Backup.</p><button class="btn pri" data-act="export">Daten exportieren (Datei)</button><button class="btn" data-act="copy">Als Text kopieren</button><div class="mut" style="margin-top:8px">Im Teilen-Menü „In Dateien sichern" wählen. Von dort kannst du die Datei direkt in der Claude-App hochladen oder per AirDrop oder Mail auf den Laptop schicken.</div></div>
 <div class="card"><h2>Import / Wiederherstellen</h2><p class="mut">Ersetzt alle Daten auf diesem Handy durch die Datei.</p><input type="file" id="imp" accept=".json,application/json,text/plain" class="t"><button class="btn" data-act="import">Importieren</button></div>
 <div class="card"><h2>Status</h2><div>${data.sessions.length} Einheiten · ${data.weights.length} Gewichtseinträge · ${data.checkins.length} Check-ins</div><div class="mut">App-Version ${APP_VERSION} · Start ${START}</div><div class="mut" style="margin-top:6px">⚠️ Wenn du das App-Icon vom Home-Bildschirm löschst, sind die Daten weg. Deshalb wöchentlich exportieren.</div></div>
 <div class="card"><button class="btn dng" data-act="reset">Alle Daten löschen</button></div>`}

function exportObj(){const d=Object.assign({},data);delete d.draft;
 const plan={};Object.keys(SESSIONS).forEach(k=>{const s=SESSIONS[k];plan[k]={name:s.name,exercises:(s.ex||[]).map(id=>EX[id].name+' ('+((s.sets&&s.sets[id])||EX[id].sets)+'×'+EX[id].reps.join('–')+' '+EX[id].rl+')'+(s.opt&&s.opt.includes(id)?' optional':''))}});
 return {app:'Trainings-App Peking',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),currentWeek:weekOf(today()),plan,data:d}}
async function exportData(){const json=JSON.stringify(exportObj(),null,1),name='training-export-'+today()+'.json';
 for(const type of ['application/json','text/plain']){try{const f=new File([json],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}}
 const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function copyData(){const json=JSON.stringify(exportObj());try{await navigator.clipboard.writeText(json);alert('Kopiert ✅')}catch(e){openModal('Daten als Text','<textarea style="min-height:50vh" readonly>'+esc(json)+'</textarea><div class="mut">Text markieren und kopieren.</div>')}}
function importData(){const f=$('#imp').files[0];if(!f){alert('Bitte zuerst eine Datei auswählen.');return}const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!Array.isArray(d.sessions))throw new Error('Keine Trainingsdaten gefunden');if(!confirm('Alle aktuellen Daten durch die Datei ersetzen?'))return;data=Object.assign(blank(),d);save();alert('Import erfolgreich ✅');go('home')}catch(e){alert('Import fehlgeschlagen: '+e.message)}};r.readAsText(f)}

// ---------- Modal & Timer ----------
function openModal(t,b){$('#sheet').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${t}</h2><button class="btn sm" data-act="close">Schließen</button></div>${b}`;$('#modal').classList.add('open');$('#sheet').scrollTop=0}
function closeModal(){$('#modal').classList.remove('open')}
let tEnd=0,tIv=null;
function startTimer(sec){tEnd=Date.now()+sec*1000;const el=$('#timer');el.classList.add('show');el.classList.remove('end');clearInterval(tIv);tick();tIv=setInterval(tick,500)}
function tick(){const r=Math.ceil((tEnd-Date.now())/1000),el=$('#timer');if(r<=0){$('#tval').textContent='Pause vorbei – nächster Satz!';el.classList.add('end');clearInterval(tIv);setTimeout(()=>{if(Date.now()-tEnd>8000)el.classList.remove('show')},9000);return}$('#tval').textContent='Pause: '+Math.floor(r/60)+':'+pad(r%60)}
function stopTimer(){clearInterval(tIv);$('#timer').classList.remove('show')}

// ---------- Events ----------
document.addEventListener('click',ev=>{
 const tb=ev.target.closest('[data-tab]');if(tb){checkinWeek=null;planDay=null;go(tb.dataset.tab);return}
 if(ev.target.id==='modal'){closeModal();return}
 const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=data.draft;
 const segOn=()=>t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));
 switch(a){
  case 'start':if(d&&!confirm('Es läuft noch ein Training. Verwerfen und neu starten?'))return;startSession(t.dataset.k,!!t.dataset.short);break;
  case 'resume':go('workout');break;
  case 'pday':planDay=+t.dataset.v;rPlan();break;
  case 'done':{const e=+t.dataset.e,s=+t.dataset.s,set=d.ex[e].sets[s];if(!set.done&&num(set.r)===null){alert('Bitte Wiederholungen eintragen.');return}set.done=!set.done;save();document.getElementById('s'+e+'_'+s).classList.toggle('done',set.done);if(set.done)startTimer(EX[d.ex[e].id].rest);break}
  case 'addset':{const e=d.ex[+t.dataset.e],l=e.sets[e.sets.length-1]||{w:'',r:''};e.sets.push({w:l.w,r:l.r,done:false});save();rWorkout();break}
  case 'eff':d.ex[+t.dataset.e].effort=t.dataset.v;save();segOn();break;
  case 'feel':d.feel=t.dataset.v;save();segOn();break;
  case 'warm':d.warm[t.dataset.id]=!d.warm[t.dataset.id];save();t.classList.toggle('on',d.warm[t.dataset.id]);t.textContent=d.warm[t.dataset.id]?'✓':'';break;
  case 'info':openModal(EX[t.dataset.id].name,exBody(t.dataset.id));break;
  case 'winfo':openModal(WARM[t.dataset.id].name,warmBody(t.dataset.id));break;
  case 'timer':startTimer(+t.dataset.sec);break;
  case 'timerstop':stopTimer();break;
  case 'close':closeModal();break;
  case 'finish':finish();break;
  case 'cancel':if(confirm('Wirklich verwerfen?')){data.draft=null;save();stopTimer();go('home')}break;
  case 'daily':{const td=today(),o=data.daily[td]=data.daily[td]||{};o[t.dataset.id]=!o[t.dataset.id];save();t.classList.toggle('on',o[t.dataset.id]);t.textContent=o[t.dataset.id]?'✓':'';break}
  case 'wsave':{const kg=num($('#wkg').value),dt=$('#wd').value||today();if(kg===null||kg<40||kg>200){alert('Bitte ein gültiges Gewicht eingeben.');return}data.weights=data.weights.filter(x=>x.date!==dt);data.weights.push({date:dt,kg});data.weights.sort((x,y)=>x.date<y.date?-1:1);save();rWeight();break}
  case 'wdel':if(confirm('Eintrag löschen?')){data.weights=data.weights.filter(x=>x.date!==t.dataset.d);save();rWeight()}break;
  case 'cw':checkinWeek=Math.max(0,curCW()+(+t.dataset.v));rCheckin();break;
  case 'scale':{const c=getCheckin(curCW());c[t.dataset.k]=+t.dataset.v;save();segOn();break}
  case 'ctoggle':{const c=getCheckin(curCW());c[t.dataset.id]=!c[t.dataset.id];save();t.classList.toggle('on',c[t.dataset.id]);t.textContent=c[t.dataset.id]?'✓':'';break}
  case 'csave':{const w=curCW(),c=getCheckin(w);['hrv','sleep','rhr','steps','chest','arm','waist','pushups'].forEach(k=>{const el=document.getElementById('c_'+k);if(el)c[k]=num(el.value)});['pain','notes','travel'].forEach(k=>{c[k]=document.getElementById('c_'+k).value});const wk=weeklyAvgs().find(x=>x.w===w),ws=data.sessions.filter(s=>weekOf(s.date)===w);c.auto={strengthSessions:ws.filter(s=>!isCardio(s)).length,swims:ws.filter(s=>s.type==='SWIM').length,runs:ws.filter(s=>s.type==='RUN').length,avgWeight:wk?+wk.avg.toFixed(2):null,daily:dailyCounts(w)};c.savedAt=new Date().toISOString();save();alert('Check-in gespeichert ✅ Jetzt exportieren.');break}
  case 'tab':checkinWeek=null;go(t.dataset.v);break;
  case 'export':exportData();break;
  case 'copy':copyData();break;
  case 'import':importData();break;
  case 'reset':if(confirm('Wirklich ALLE Daten löschen?')&&confirm('Sicher? Hast du vorher exportiert?')){data=blank();save();go('home')}break;
 }
});
document.addEventListener('input',ev=>{const t=ev.target;if(view!=='workout'||!data.draft||!t.dataset.f)return;const d=data.draft;if(t.dataset.e!==undefined)d.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=t.value;else d[t.dataset.f]=t.value;save()});

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
